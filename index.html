<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submerged Temple · Live shader</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10191c;color:#e9f3f3}
body{margin:0;min-height:100vh;display:grid;place-items:center}
main{width:min(1120px,94vw);padding:1rem 0}h1{font-size:1.35rem;font-weight:580}
canvas{display:block;width:100%;aspect-ratio:4400/1884;background:#07151d}
.controls{display:flex;align-items:center;gap:.85rem;margin:.85rem 0}
input{flex:1;min-width:3rem;accent-color:#8bd1d7}
button{font:inherit;padding:.34rem .75rem}output{min-width:4.5rem;font-variant-numeric:tabular-nums}
a{color:#b5e2e5}pre{white-space:pre-wrap}
</style>
<main>
<h1>Submerged Temple</h1>
<canvas width="880" height="376" aria-label="Continuously animated underwater ruins"></canvas>
<div class="controls"><button type="button" disabled>Play</button><input type="range" aria-label="Frame" min="0" value="0" disabled><output>0.000 s</output></div>
<p role="status">Preparing the live shader…</p>
<a href="https://github.com/gokayfem/submerged-temple-loop/blob/main/wildlife-loop.glsl">View shader code</a> · <a href="wildlife-loop.glsl" download>Download GLSL</a>
<pre role="alert"></pre>
</main>

<script type="module">
'use strict';
const fps=24, frames=1440;
const canvas=document.querySelector('canvas'), button=document.querySelector('button');
const seek=document.querySelector('input'), output=document.querySelector('output');
const status=document.querySelector('[role="status"]'), alert=document.querySelector('[role="alert"]');
seek.max=frames-1;
const gl=canvas.getContext('webgl2',{alpha:false,antialias:false,preserveDrawingBuffer:true});
let playing=false, animation=0, start=0, current=-1, contextLost=false;
function pause(){
    playing=false;
    cancelAnimationFrame(animation);
    button.textContent='Play';
}
function error(message){
    pause();
    status.hidden=true;
    alert.textContent=message;
    button.disabled=seek.disabled=true;
}
function compile(kind,source){
    const shader=gl.createShader(kind);
    gl.shaderSource(shader,source);
    gl.compileShader(shader);
    if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));
    return shader;
}
try{
    if(!gl)throw Error('WebGL 2 is required for the live shader.');
    const response = await fetch("wildlife-loop.glsl");
    if (!response.ok) throw Error("Could not load the shader source.");
    const source = await response.text();
    const vertex=compile(gl.VERTEX_SHADER,`#version 300 es
    void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(2.0*p-1.0,0,1);}`);
    const fragment=compile(gl.FRAGMENT_SHADER,`#version 300 es
    precision highp float;precision highp int;uniform vec3 iResolution;uniform float iTime;out vec4 color;
    `+source+`
    void main(){mainImage(color,gl_FragCoord.xy);}`);
    const program=gl.createProgram();
    for(const shader of [vertex,fragment])gl.attachShader(program,shader);
    gl.linkProgram(program);
    if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    gl.uniform3f(gl.getUniformLocation(program,'iResolution'),canvas.width,canvas.height,1);
    const seconds=gl.getUniformLocation(program,'iTime');
    function draw(frame){
        if(frame===current)return;
        current=frame;
        seek.value=frame;
        output.value=(frame/fps).toFixed(3)+' s';
        gl.uniform1f(seconds,frame/fps);
        gl.drawArrays(gl.TRIANGLES,0,3);
    }
    function advance(now){
        draw(Math.max(0,Math.floor((now-start)*fps/1000))%frames);
        animation=requestAnimationFrame(advance);
    }
    button.onclick=()=>{
        if(playing){pause();return;}
        start=performance.now()-current*1000/fps;
        playing=true;
        button.textContent='Pause';
        animation=requestAnimationFrame(advance);
    };
    seek.oninput=()=>{pause();draw(Number(seek.value));};
    canvas.addEventListener('webglcontextlost',()=>{
        contextLost=true;
        error('The live shader lost its WebGL context. Reload to try again.');
    });
    draw(0);
    const fence=gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE,0);
    if(!fence)throw Error('Could not prepare the first shader frame.');
    gl.flush();
    function ready(){
        if(contextLost)return;
        const state=gl.clientWaitSync(fence,0,0);
        if(state===gl.TIMEOUT_EXPIRED){requestAnimationFrame(ready);return;}
        gl.deleteSync(fence);
        if(state===gl.WAIT_FAILED){error('Could not draw the first shader frame.');return;}
        status.hidden=true;
        button.disabled=seek.disabled=false;
        button.click();
    }
    requestAnimationFrame(ready);
}catch(exc){error(exc.message);}
</script>
